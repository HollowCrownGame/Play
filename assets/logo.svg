<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>The Hollow Crown</title>
  <defs>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="52%" stop-color="#fff1cc" stop-opacity="0.95"/>
      <stop offset="60%" stop-color="#e8c47a" stop-opacity="0.55"/>
      <stop offset="74%" stop-color="#c9a35a" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a35a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="disk" cx="44%" cy="40%" r="62%">
      <stop offset="0%" stop-color="#16141a"/>
      <stop offset="100%" stop-color="#030304"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbe7b0"/>
      <stop offset="45%" stop-color="#d6ac5c"/>
      <stop offset="100%" stop-color="#7a5524"/>
    </linearGradient>
    <linearGradient id="goldEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="100%" stop-color="#a87a36"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the crown's outline with the inside cut away: it is hollow -->
    <mask id="hollow">
      <rect width="512" height="512" fill="#fff"/>
      <path d="M170 318 L163 238 L206 288 L214 214 L245 282 L256 186 L267 282 L298 214 L306 288 L349 238 L342 318 Z" fill="#000"/>
    </mask>
  </defs>

  <!-- eclipse: corona and the dead sun -->
  <circle cx="256" cy="232" r="214" fill="url(#corona)"/>
  <circle cx="256" cy="232" r="148" fill="url(#disk)"/>
  <circle cx="256" cy="232" r="148" fill="none" stroke="#fff3d4" stroke-opacity="0.85" stroke-width="2.5"/>

  <!-- crown -->
  <g filter="url(#glow)">
    <path mask="url(#hollow)" fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="2" stroke-linejoin="round"
      d="M142 336 L128 196 L196 270 L204 168 L242 258 L256 120 L270 258 L308 168 L316 270 L384 196 L370 336 Z"/>
    <!-- band -->
    <path fill="url(#gold)" stroke="url(#goldEdge)" stroke-width="2"
      d="M134 334 Q256 312 378 334 L374 376 Q256 356 138 376 Z"/>
    <path fill="#0b0a0c" d="M150 346 Q256 328 362 346 L360 364 Q256 348 152 364 Z"/>
    <!-- three dark gems in the band -->
    <circle cx="200" cy="351" r="6" fill="#5a0f10" stroke="#e8c47a" stroke-width="1.5"/>
    <circle cx="256" cy="344" r="8" fill="#7a1414" stroke="#f3dca0" stroke-width="2"/>
    <circle cx="312" cy="351" r="6" fill="#5a0f10" stroke="#e8c47a" stroke-width="1.5"/>
    <!-- finials -->
    <circle cx="128" cy="190" r="9" fill="url(#gold)"/>
    <circle cx="204" cy="161" r="9" fill="url(#gold)"/>
    <path d="M256 96 L266 116 L256 132 L246 116 Z" fill="#fbe7b0"/>
    <circle cx="308" cy="161" r="9" fill="url(#gold)"/>
    <circle cx="384" cy="190" r="9" fill="url(#gold)"/>
  </g>

  <!-- the crack splitting the crown and the band -->
  <path d="M262 120 L252 168 L266 204 L249 252 L262 296 L251 334 L260 376" fill="none" stroke="#050507" stroke-width="5" stroke-linejoin="miter"/>
  <path d="M262 120 L252 168 L266 204 L249 252 L262 296 L251 334 L260 376" fill="none" stroke="#9a2a20" stroke-width="1.4" stroke-opacity="0.9"/>

  <!-- a single drop falling from the break -->
  <path d="M260 392 C254 404 254 412 260 416 C266 412 266 404 260 392 Z" fill="#8e1b1b"/>
</svg>
